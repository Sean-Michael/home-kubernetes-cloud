# Tailnet hostnames for the media UIs via the shared caliban-gateway.
# NodePorts (caliban:300xx) remain the LAN fallback if the mesh/gateway is
# down. Plex itself is hostNetwork (caliban:32400) and needs no route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: media
spec:
  parentRefs:
    - name: caliban-gateway
      namespace: istio-ingress
  hostnames:
    - sonarr.tail4dd976.ts.net
  rules:
    - backendRefs:
        - name: sonarr
          port: 8989
---
